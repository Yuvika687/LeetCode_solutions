<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="RPG Player HUD">
  <defs>
    <linearGradient id="rpgBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="expGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', monospace; }
    .pulse-dot { animation: pdot 2s ease-in-out infinite; }
    @keyframes pdot { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  </style>

  <!-- Card Body -->
  <rect x="1" y="1" width="1198" height="258" rx="16" fill="#0b0d1a" stroke="url(#rpgBorder)" stroke-width="2"/>

  <!-- Left Column: Player Stats -->
  <g transform="translate(36, 32)">
    <!-- Class & Level Badge -->
    <rect x="0" y="0" width="140" height="26" rx="13" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-opacity="0.5"/>
    <text x="70" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#c084fc">LEVEL 10 SENTINEL</text>

    <!-- Player Name -->
    <text x="0" y="62" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="28" fill="#e2e8f0">
      Yuvika Malhotra
    </text>
    <text x="0" y="86" class="mono" font-size="12" fill="#94a3b8">
      ROLE: ALGORITHM ARCHITECT · PATTERN MASTER
    </text>

    <!-- HP Bar -->
    <g transform="translate(0, 110)">
      <text x="0" y="12" class="mono" font-size="11" font-weight="700" fill="#f87171">HP (STAMINA)</text>
      <text x="240" y="12" text-anchor="end" class="mono" font-size="11" fill="#94a3b8">100 / 100</text>
      <rect x="0" y="20" width="240" height="8" rx="4" fill="#1e1b4b"/>
      <rect x="0" y="20" width="240" height="8" rx="4" fill="#ef4444"/>
    </g>

    <!-- MP Bar -->
    <g transform="translate(270, 110)">
      <text x="0" y="12" class="mono" font-size="11" font-weight="700" fill="#38bdf8">MP (LOGIC)</text>
      <text x="240" y="12" text-anchor="end" class="mono" font-size="11" fill="#94a3b8">95 / 100</text>
      <rect x="0" y="20" width="240" height="8" rx="4" fill="#1e1b4b"/>
      <rect x="0" y="20" width="228" height="8" rx="4" fill="#0ea5e9"/>
    </g>

    <!-- EXP Bar -->
    <g transform="translate(0, 160)">
      <text x="0" y="12" class="mono" font-size="11" font-weight="700" fill="#a3e635">EXP TO NEXT TIER</text>
      <text x="510" y="12" text-anchor="end" class="mono" font-size="11" fill="#94a3b8">450 / 500 EXP (90%)</text>
      <rect x="0" y="20" width="510" height="10" rx="5" fill="#1e1b4b"/>
      <rect x="0" y="20" width="459" height="10" rx="5" fill="url(#expGrad)"/>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="620" y1="28" x2="620" y2="232" stroke="#1e1b4b" stroke-width="1.5"/>

  <!-- Right Column: Active Quests & Milestones -->
  <g transform="translate(650, 32)">
    <text x="0" y="18" class="mono" font-size="12" font-weight="700" fill="#22d3ee" letter-spacing="2px">
      ⚔️ ACTIVE CAMPAIGNS &amp; QUESTS
    </text>

    <!-- Quest 1 -->
    <g transform="translate(0, 36)">
      <rect width="500" height="48" rx="8" fill="#140f2b" stroke="#334155" stroke-width="0.8"/>
      <circle cx="24" cy="24" r="5" fill="#a3e635" class="pulse-dot"/>
      <text x="44" y="22" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#e2e8f0">Daily Quest: Forge the Problem</text>
      <text x="44" y="38" class="mono" font-size="11" fill="#94a3b8">Solve &amp; push 1+ optimal solution today (+25 EXP · Streak Shield)</text>
      <text x="480" y="28" text-anchor="end" class="mono" font-size="11" font-weight="700" fill="#a3e635">ACTIVE</text>
    </g>

    <!-- Quest 2 -->
    <g transform="translate(0, 94)">
      <rect width="500" height="48" rx="8" fill="#140f2b" stroke="#334155" stroke-width="0.8"/>
      <circle cx="24" cy="24" r="5" fill="#fbbf24"/>
      <text x="44" y="22" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#e2e8f0">Boss Battle: Weekly Contest</text>
      <text x="44" y="38" class="mono" font-size="11" fill="#94a3b8">Compete in LeetCode Biweekly / Weekly contest (+100 EXP)</text>
      <text x="480" y="28" text-anchor="end" class="mono" font-size="11" font-weight="700" fill="#fbbf24">READY</text>
    </g>

    <!-- Quest 3 -->
    <g transform="translate(0, 152)">
      <rect width="500" height="48" rx="8" fill="#140f2b" stroke="#334155" stroke-width="0.8"/>
      <circle cx="24" cy="24" r="5" fill="#8b5cf6"/>
      <text x="44" y="22" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#e2e8f0">Epic Milestone: Centurion (100 Problems)</text>
      <text x="44" y="38" class="mono" font-size="11" fill="#94a3b8">Categorize 100 patterns with mathematical rigor</text>
      <text x="480" y="28" text-anchor="end" class="mono" font-size="11" font-weight="700" fill="#8b5cf6">IN PROGRESS</text>
    </g>
  </g>
</svg>
