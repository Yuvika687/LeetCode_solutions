<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Algorithm Replay Execution Visualizer">
  <defs>
    <linearGradient id="replayBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', monospace; }
    .box { rx: 10px; stroke-width: 1.5; }
    
    /* Frame 1: 0 - 33% */
    .f1 { animation: step1 9s infinite; }
    @keyframes step1 { 0%, 30% { opacity: 1; } 33%, 100% { opacity: 0; } }

    /* Frame 2: 33% - 66% */
    .f2 { animation: step2 9s infinite; }
    @keyframes step2 { 0%, 30% { opacity: 0; } 33%, 63% { opacity: 1; } 66%, 100% { opacity: 0; } }

    /* Frame 3: 66% - 100% */
    .f3 { animation: step3 9s infinite; }
    @keyframes step3 { 0%, 63% { opacity: 0; } 66%, 97% { opacity: 1; } 100% { opacity: 0; } }
  </style>

  <!-- Container -->
  <rect width="1200" height="240" rx="16" fill="#0b0d1a" stroke="#1e1b4b" stroke-width="1.5"/>

  <!-- Top Header Bar -->
  <path d="M 0,16 Q 0,0 16,0 L 1184,0 Q 1200,0 1200,16 L 1200,42 L 0,42 Z" fill="#140f2b"/>
  <circle cx="28" cy="21" r="6" fill="#ef4444"/>
  <circle cx="48" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="21" r="6" fill="#10b981"/>
  <text x="600" y="26" text-anchor="middle" class="mono" font-size="12" fill="#94a3b8">
    ALGORITHM EXECUTION TRACE // LEETCODE 881: BOATS TO SAVE PEOPLE [TWO POINTERS, O(N)]
  </text>

  <!-- Array Elements (people = [1, 2, 2, 3], limit = 3) -->
  <g transform="translate(180, 80)">
    <!-- Cell 0: val 1 -->
    <g transform="translate(0, 0)">
      <rect width="160" height="70" rx="10" fill="#1e1b4b" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="80" y="44" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="28" fill="#60a5fa">1</text>
      <text x="80" y="92" text-anchor="middle" class="mono" font-size="12" fill="#64748b">idx: 0</text>
    </g>

    <!-- Cell 1: val 2 -->
    <g transform="translate(220, 0)">
      <rect width="160" height="70" rx="10" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="80" y="44" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="28" fill="#c084fc">2</text>
      <text x="80" y="92" text-anchor="middle" class="mono" font-size="12" fill="#64748b">idx: 1</text>
    </g>

    <!-- Cell 2: val 2 -->
    <g transform="translate(440, 0)">
      <rect width="160" height="70" rx="10" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="80" y="44" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="28" fill="#c084fc">2</text>
      <text x="80" y="92" text-anchor="middle" class="mono" font-size="12" fill="#64748b">idx: 2</text>
    </g>

    <!-- Cell 3: val 3 -->
    <g transform="translate(660, 0)">
      <rect width="160" height="70" rx="10" fill="#1e1b4b" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="80" y="44" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="28" fill="#fb7185">3</text>
      <text x="80" y="92" text-anchor="middle" class="mono" font-size="12" fill="#64748b">idx: 3</text>
    </g>
  </g>

  <!-- Step 1 Overlay -->
  <g class="f1">
    <!-- Pointer L at idx 0 -->
    <text x="260" y="70" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#22d3ee">L ▼</text>
    <!-- Pointer R at idx 3 -->
    <text x="920" y="70" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#f472b6">R ▼</text>
    <!-- State Box -->
    <rect x="180" y="190" width="820" height="34" rx="8" fill="#140f2b" stroke="#22d3ee" stroke-width="1"/>
    <text x="590" y="212" text-anchor="middle" class="mono" font-size="12" fill="#22d3ee">
      STEP 1: people[L](1) + people[R](3) = 4 &gt; limit(3) ➔ Heaviest (3) takes boat alone ➔ R moves left ➔ BOATS: 1
    </text>
  </g>

  <!-- Step 2 Overlay -->
  <g class="f2">
    <!-- Pointer L at idx 0 -->
    <text x="260" y="70" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#22d3ee">L ▼</text>
    <!-- Pointer R at idx 2 -->
    <text x="700" y="70" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#f472b6">R ▼</text>
    <!-- State Box -->
    <rect x="180" y="190" width="820" height="34" rx="8" fill="#140f2b" stroke="#a3e635" stroke-width="1"/>
    <text x="590" y="212" text-anchor="middle" class="mono" font-size="12" fill="#a3e635">
      STEP 2: people[L](1) + people[R](2) = 3 &lt;= limit(3) ➔ Pair fits! (1, 2) share boat ➔ L++, R-- ➔ BOATS: 2
    </text>
  </g>

  <!-- Step 3 Overlay -->
  <g class="f3">
    <!-- Pointer L & R at idx 1 -->
    <text x="480" y="70" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#fbbf24">L, R ▼</text>
    <!-- State Box -->
    <rect x="180" y="190" width="820" height="34" rx="8" fill="#140f2b" stroke="#fbbf24" stroke-width="1"/>
    <text x="590" y="212" text-anchor="middle" class="mono" font-size="12" fill="#fbbf24">
      STEP 3: L == R (2) &lt;= limit(3) ➔ Last person rescued ➔ Search terminated ➔ TOTAL BOATS: 3 [OPTIMAL]
    </text>
  </g>
</svg>
