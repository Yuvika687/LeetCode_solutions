<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Algorithms &amp; Data Structures — Pattern Repository">
  <defs>
    <radialGradient id="dsaGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#090d16" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dotPattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <style>
    .h1 { font-family: 'Inter', -apple-system, system-ui, sans-serif; font-weight: 700; font-size: 44px; letter-spacing: -1px; fill: #ffffff; }
    .sub { font-family: 'Inter', -apple-system, system-ui, sans-serif; font-weight: 400; font-size: 16px; letter-spacing: -0.2px; fill: #94a3b8; }
    .mono { font-family: 'SF Mono', 'Geist Mono', 'JetBrains Mono', monospace; font-size: 11px; fill: #cbd5e1; }
  </style>

  <!-- Canvas -->
  <rect width="1200" height="240" rx="16" fill="#000000"/>
  <rect width="1200" height="240" rx="16" fill="url(#dsaGlow)"/>
  <rect width="1200" height="240" rx="16" fill="url(#dotPattern)"/>
  <rect width="1200" height="240" rx="16" fill="none" stroke="#1e293b" stroke-width="1"/>

  <line x1="80" y1="1" x2="1120" y2="1" stroke="url(#topLine)" stroke-width="2"/>

  <!-- Content Block -->
  <g transform="translate(64, 56)">
    <!-- Pill -->
    <rect x="0" y="0" width="230" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <circle cx="12" cy="12" r="3" fill="#38bdf8"/>
    <text x="24" y="16" class="mono" font-size="10" font-weight="600" fill="#38bdf8" letter-spacing="1px">
      ALGORITHMIC RIGOR &amp; PROOFS
    </text>

    <!-- Main Title -->
    <text x="0" y="66" class="h1">Data Structures &amp; Algorithms</text>
    <text x="0" y="96" class="sub">Curated pattern implementations, loop invariants, and asymptotic Big-O bounds</text>

    <!-- Metrics -->
    <g transform="translate(0, 122)">
      <rect width="105" height="22" rx="6" fill="#0b0f19" stroke="#1e293b"/>
      <text x="52" y="15" text-anchor="middle" class="mono" font-size="10">C++17 / Python</text>

      <g transform="translate(115, 0)">
        <rect width="120" height="22" rx="6" fill="#0b0f19" stroke="#1e293b"/>
        <text x="60" y="15" text-anchor="middle" class="mono" font-size="10">Pattern-Driven</text>
      </g>

      <g transform="translate(245, 0)">
        <rect width="130" height="22" rx="6" fill="#0b0f19" stroke="#1e293b"/>
        <text x="65" y="15" text-anchor="middle" class="mono" font-size="10">Automated CLI Tool</text>
      </g>
    </g>
  </g>
</svg>
