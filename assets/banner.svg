<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="DSA · LeetCode Arsenal">
  <defs>
    <linearGradient id="dsaBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05070f"/>
      <stop offset="68%" stop-color="#0b0d1a"/>
      <stop offset="100%" stop-color="#140f2b"/>
    </linearGradient>

    <radialGradient id="dsaHorizonGlow" cx="50%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0b0d1a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="dsaTitleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="35%" stop-color="#f472b6"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="dsaFloorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dsaFloorMask">
      <rect x="0" y="240" width="1200" height="120" fill="url(#dsaFloorFade)"/>
    </mask>

    <filter id="dsaGlow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .star { animation: tw 3s ease-in-out infinite; }
    .star2 { animation: tw 4.5s ease-in-out infinite 1.5s; }
    @keyframes tw { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.9; } }
    .hud { font-family: 'JetBrains Mono', monospace; letter-spacing: 2px; font-size: 11px; fill: #22d3ee; }
  </style>

  <rect width="1200" height="360" fill="url(#dsaBg)"/>

  <!-- Star Field -->
  <g fill="#93c5fd" opacity="0.6">
    <circle cx="150" cy="50" r="1.5" class="star"/>
    <circle cx="320" cy="80" r="1.2" class="star2"/>
    <circle cx="580" cy="40" r="1.8" class="star"/>
    <circle cx="850" cy="70" r="1.2" class="star2"/>
    <circle cx="1050" cy="45" r="1.5" class="star"/>
  </g>

  <!-- Horizon Light Flare -->
  <circle cx="600" cy="240" r="420" fill="url(#dsaHorizonGlow)"/>

  <!-- Moving 3D Grid Floor -->
  <g mask="url(#dsaFloorMask)" stroke="#8b5cf6" stroke-width="1.2" opacity="0.75">
    <line x1="600" y1="240" x2="-600" y2="360"/>
    <line x1="600" y1="240" x2="-300" y2="360"/>
    <line x1="600" y1="240" x2="0" y2="360"/>
    <line x1="600" y1="240" x2="200" y2="360"/>
    <line x1="600" y1="240" x2="400" y2="360"/>
    <line x1="600" y1="240" x2="520" y2="360"/>
    <line x1="600" y1="240" x2="600" y2="360"/>
    <line x1="600" y1="240" x2="680" y2="360"/>
    <line x1="600" y1="240" x2="800" y2="360"/>
    <line x1="600" y1="240" x2="1000" y2="360"/>
    <line x1="600" y1="240" x2="1200" y2="360"/>
    <line x1="600" y1="240" x2="1500" y2="360"/>
    <line x1="600" y1="240" x2="1800" y2="360"/>

    <!-- Animated Horizontal Lines -->
    <line x1="0" x2="1200" y1="240" y2="240">
      <animate attributeName="y1" values="240;360" dur="2.5s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 1 .45"/>
      <animate attributeName="y2" values="240;360" dur="2.5s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 1 .45"/>
    </line>
    <line x1="0" x2="1200" y1="240" y2="240">
      <animate attributeName="y1" values="240;360" dur="2.5s" begin="-0.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 1 .45"/>
      <animate attributeName="y2" values="240;360" dur="2.5s" begin="-0.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 1 .45"/>
    </line>
    <line x1="0" x2="1200" y1="240" y2="240">
      <animate attributeName="y1" values="240;360" dur="2.5s" begin="-1.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 1 .45"/>
      <animate attributeName="y2" values="240;360" dur="2.5s" begin="-1.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 1 .45"/>
    </line>
    <line x1="0" x2="1200" y1="240" y2="240">
      <animate attributeName="y1" values="240;360" dur="2.5s" begin="-1.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 1 .45"/>
      <animate attributeName="y2" values="240;360" dur="2.5s" begin="-1.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 1 .45"/>
    </line>
    <line x1="0" x2="1200" y1="240" y2="240">
      <animate attributeName="y1" values="240;360" dur="2.5s" begin="-2.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 1 .45"/>
      <animate attributeName="y2" values="240;360" dur="2.5s" begin="-2.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 1 .45"/>
    </line>
  </g>

  <!-- Laser Horizon -->
  <line x1="0" y1="240" x2="1200" y2="240" stroke="#f472b6" stroke-width="2" filter="url(#dsaGlow)"/>

  <!-- Top Tech Bar -->
  <g class="hud">
    <text x="50" y="38">// LEETCODE MATRIX: ONLINE</text>
    <text x="600" y="38" text-anchor="middle">RECURSION · POINTERS · DYNAMIC PROGRAMMING · GRAPHS</text>
    <text x="1150" y="38" text-anchor="end">LEVEL: ARCHITECT</text>
    <line x1="50" y1="48" x2="1150" y2="48" stroke="#1e1b4b" stroke-width="1.5"/>
  </g>

  <!-- Central Title -->
  <g text-anchor="middle">
    <rect x="470" y="68" width="260" height="26" rx="13" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.4"/>
    <text x="600" y="85" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#a78bfa" letter-spacing="2px">⚔️ COMBAT PROTOCOL</text>

    <text x="600" y="148" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="900" font-size="54" letter-spacing="4px" fill="none" stroke="#8b5cf6" stroke-width="6" opacity="0.4" filter="url(#dsaGlow)">
      DSA · LEETCODE ARSENAL
    </text>
    <text x="600" y="148" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="900" font-size="54" letter-spacing="4px" fill="url(#dsaTitleGrad)">
      DSA · LEETCODE ARSENAL
    </text>

    <text x="600" y="188" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500" letter-spacing="3px" fill="#e2e8f0">
      SYSTEMATIC PATTERNS · MATHEMATICAL PROOFS · BIG-O MASTERY
    </text>
  </g>
</svg>
